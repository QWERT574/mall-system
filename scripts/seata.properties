# ============================================
# Seata Server 配置 (seata.properties)
# 放在 Nacos 配置中心，data-id: seata.properties
# 或者直接挂载到 Seata Server 容器
# ============================================

# 事务分组 → TC 集群映射
service.vgroupMapping.minimall-tx-group=default

# 存储模式：db（生产）、file（开发单机）
store.mode=file

# 使用 file 存储时不需要数据库配置
# 使用 db 存储时取消下面注释：
# store.mode=db
# store.db.datasource=druid
# store.db.dbType=mysql
# store.db.driverClassName=com.mysql.cj.jdbc.Driver
# store.db.url=jdbc:mysql://mysql:3306/seata?useUnicode=true
# store.db.user=root
# store.db.password=rootpass

# 日志
logging.level.io.seata=INFO
