spring.application.name: ai-service
spring.cloud.nacos.discovery.server-addr: ${NACOS_HOST:localhost}:8848
server.port: 8086
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:minimall}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # Spring AI：DeepSeek 模型接入（阶段二，生成层框架化）
  # api-key 复用 DEEPSEEK_API_KEY 环境变量；base-url 默认 DeepSeek 官方，可指向兼容网关
  ai:
    model:
      deepseek:
        api-key: ${DEEPSEEK_API_KEY:}
        base-url: https://api.deepseek.com
        chat:
          options:
            model: ${DEEPSEEK_MODEL:deepseek-chat}
            temperature: ${DEEPSEEK_TEMPERATURE:0.7}
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config.db-config: {id-type: auto, logic-delete-field: deleted, logic-delete-value: 1, logic-not-delete-value: 0}
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
