spring.application.name: order-service
spring.cloud.nacos.discovery.server-addr: ${NACOS_HOST:localhost}:8848
server.port: 8083
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:minimall}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== RocketMQ 配置 =====
rocketmq:
  name-server: ${ROCKETMQ_HOST:localhost}:9876
  producer:
    group: order-producer-group        # 生产者组
    send-message-timeout: 3000         # 发送超时 3s
    retry-times-when-send-failed: 2    # 失败重试 2 次

# ===== Seata 分布式事务配置 =====
seata:
  enabled: true
  tx-service-group: minimall-tx-group         # 事务分组（与 TC 集群名对应）
  registry:
    type: nacos                               # 注册中心 — Nacos
    nacos:
      server-addr: ${NACOS_HOST:localhost}:8848
      application: seata-server
      group: DEFAULT_GROUP
  config:
    type: nacos                               # 配置中心 — Nacos
    nacos:
      server-addr: ${NACOS_HOST:localhost}:8848
      group: DEFAULT_GROUP
      data-id: seata.properties
  data-source-proxy-mode: AT                  # 自动代理数据源（AT 模式核心）
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
